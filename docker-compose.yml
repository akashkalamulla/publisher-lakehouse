services:
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  warehouse:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/warehouse/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  objectstore:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_REGION: us-east-1
    volumes:
      - lake-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null && curl -fsS http://127.0.0.1:9001/rustfs/console/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  spark:
    image: publisher-lakehouse-runtime:local
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      target: runtime
    volumes:
      - ./publisher_lakehouse:/opt/app/publisher_lakehouse:ro
      - ./tests_spark:/opt/app/tests_spark:ro
    environment:
      PYTHONPATH: /opt/app
      PYTHONDONTWRITEBYTECODE: "1"
      SPARK_LOCAL_IP: 0.0.0.0
      S3_ENDPOINT_URL: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    depends_on:
      objectstore:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040"

  spark-job:
    profiles: ["jobs"]
    image: publisher-lakehouse-job:local
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      target: job
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}

  airflow-db:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    image: &airflow-image apache/airflow:3.3.2-python3.12@sha256:9df9c8be4096b9cc626bd7cb1f2b8c712eef66c59c615f8c7e6200871ca10bd1
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        python -c 'import os, sys; from urllib.parse import quote; sys.stdout.write("postgresql+psycopg2://airflow:" + quote(os.environ["AIRFLOW_DB_PASSWORD"], safe="") + "@airflow-db:5432/airflow")'
    # Root only creates the new auth volume's directory, which Docker mounts
    # root-owned; everything else runs as the image's airflow user.
    user: "0:0"
    volumes: &airflow-auth-volumes
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-auth:/opt/airflow/auth
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -euc
      - |
        install -d -o airflow -g 0 -m 0700 /opt/airflow/auth
        rm -f /opt/airflow/logs/simple_auth_manager_passwords.json
        runuser -u airflow -- python - <<'PY'
        import json
        import os
        from pathlib import Path
        path = Path(os.environ["AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"])
        path.write_text(json.dumps({os.environ["AIRFLOW_ADMIN_USER"]: os.environ["AIRFLOW_ADMIN_PASSWORD"]}), encoding="utf-8")
        path.chmod(0o600)
        PY
        runuser -u airflow -- airflow db migrate
        runuser -u airflow -- airflow pools set lake_writer 1 "Single Delta lake writer"

  airflow-apiserver:
    image: *airflow-image
    environment: *airflow-env
    volumes: *airflow-auth-volumes
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    image: *airflow-image
    environment: &airflow-job-env
      <<: *airflow-env
      S3_ENDPOINT_URL: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    image: *airflow-image
    environment: *airflow-job-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-auth:
  airflow-db-data:
  airflow-logs:
  grafana-data:
  lake-data:
  warehouse-data:
