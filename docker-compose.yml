services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  spark:
    build: ./docker/spark
    volumes:
      - ./publisher_lakehouse:/opt/app/publisher_lakehouse:ro
    environment:
      PYTHONPATH: /opt/app
      PYTHONDONTWRITEBYTECODE: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  minio-data:
