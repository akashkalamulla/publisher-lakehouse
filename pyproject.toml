[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-lakehouse"
version = "0.1.0"
description = "Deduplicated academic publisher metadata ingestion"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "SQLAlchemy>=2.0",
    "structlog>=24.4",
    "typer>=0.15",
    "XlsxWriter==3.2.9",
    "zendriver==0.16.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["publisher_lakehouse*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

